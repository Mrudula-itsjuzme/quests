services:
  - type: web
    name: quests-app
    env: node
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quests-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOW_STUB_VISION_IN_PRODUCTION
        value: "true"


  - type: cron
    name: quests-scheduler
    env: node
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/run-scheduler.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quests-db
          property: connectionString
      - key: CRON_SECRET
        fromService:
          type: web
          name: quests-app
          envVarKey: CRON_SECRET

databases:
  - name: quests-db
    databaseName: questdb
    user: questuser
