services:
  - type: web
    name: quests-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quests-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      # Add the remaining required auth, provider, CORS, and Vite values from
      # .env.production.example in the Render dashboard. Startup fails closed
      # until they are supplied; the stub vision provider has no production override.

  - type: cron
    name: quests-scheduler
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/run-scheduler.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        fromService:
          type: web
          name: quests-app
          envVarKey: CRON_SECRET
      - key: SCHEDULER_URL
        value: https://quests-app.onrender.com/api/internal/scheduler

databases:
  - name: quests-db
    databaseName: questdb
    user: questuser
