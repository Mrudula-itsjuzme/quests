name: Build and Release Apps

on:
  push:
    tags:
      - 'v*'

# Tag pushes are one-shot releases; never cancel a run that is in progress.
# Grouping on the tag still serializes re-pushes of the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          # Capacitor Android compiles with Java 21 (source/target VERSION_21).
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS App (Unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
          # Archive the app bundle to a zip file for the release. Products are
          # at build/Build/Products/Release-iphoneos under ios/App, so 4 levels
          # up lands at ios/App/App-iOS-Unsigned.zip (matching the upload path).
          cd build/Build/Products/Release-iphoneos
          zip -r ../../../../App-iOS-Unsigned.zip App.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Unsigned.zip
          path: ios/App/App-iOS-Unsigned.zip

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: App-iOS-Unsigned.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-debug.apk
            App-iOS-Unsigned.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
