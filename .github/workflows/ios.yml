name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        # CI has no backend URL to point a native client at, so build the
        # offline-native bundle; this step only verifies the app compiles.
        env:
          VITE_OFFLINE_NATIVE: 'true'
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync ios

      # To build an IPA you need provisioning profiles and certificates,
      # which are typically passed via secrets.
      # This step does a basic xcodebuild to ensure the project compiles.
      # Capacitor projects ship App.xcodeproj (not a top-level workspace);
      # xcodebuild auto-generates the scheme from the App target.
      - name: Build iOS Project
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build
