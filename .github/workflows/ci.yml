name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs so rapid pushes don't stack jobs (esp. billable
# macOS runners); PR groups are per-branch so concurrent branches proceed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci

      - name: Build app
        run: npm run build

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: questdb
          POSTGRES_USER: questuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questuser -d questdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgres://questuser:testpass@127.0.0.1:5432/questdb
        run: npm run migrate

      - name: Run Postgres integration tests
        env:
          TEST_DATABASE_URL: postgres://questuser:testpass@127.0.0.1:5432/questdb
        run: npm run test:ci -- api/postgres.integration.test.js

      - name: Run npm audit (report only)
        run: npm audit --omit=dev || true

  preflight:
    name: Production env gate (main pushes only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production env checks
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          PROVIDER_MODE: ${{ secrets.PROVIDER_MODE }}
          QUEST_AI_VERIFY_URL: ${{ secrets.QUEST_AI_VERIFY_URL }}
          QUEST_PROVIDER_SECRET: ${{ secrets.QUEST_PROVIDER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ secrets.OIDC_AUDIENCE }}
          OIDC_JWKS_URL: ${{ secrets.OIDC_JWKS_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          TRUST_PROXY: ${{ secrets.TRUST_PROXY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VISION_PROVIDER: ${{ secrets.VISION_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALLOW_STUB_VISION_IN_PRODUCTION: ${{ secrets.ALLOW_STUB_VISION_IN_PRODUCTION }}
        run: node scripts/check_prod_env.js
