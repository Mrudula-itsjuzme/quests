name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  preflight:
    name: Preflight (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run production env checks
        env:
          # These should be set as repo secrets in production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_MODE: ${{ secrets.PROVIDER_MODE }}
          QUEST_AI_VERIFY_URL: ${{ secrets.QUEST_AI_VERIFY_URL }}
          QUEST_PROVIDER_SECRET: ${{ secrets.QUEST_PROVIDER_SECRET }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_JWKS_URL: ${{ secrets.OIDC_JWKS_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: node scripts/check_prod_env.js

  test:
    name: Run unit and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: questdb
          POSTGRES_USER: questuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questuser -d questdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report)
        run: npm audit --production || true

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U questuser -d questdb && break || sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: postgres://questuser:testpass@127.0.0.1:5432/questdb
        run: npm run migrate

      - name: Run Postgres integration tests
        env:
          TEST_DATABASE_URL: postgres://questuser:testpass@127.0.0.1:5432/questdb
        run: npm run test:ci -- api/postgres.integration.test.js
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: questdb
          POSTGRES_USER: questuser
          POSTGRES_PASSWORD: questpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U questuser -d questdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (includes PostgreSQL integration suite)
        run: npm run test:ci
        env:
          TEST_DATABASE_URL: postgres://questuser:questpass@localhost:5432/questdb

      - name: Build app
        run: npm run build

      - name: Build Docker image
        run: docker build -t quests-app-ci .
